{id:'a',letter:'A',short:'I work in London',eyebrow:'Reading · Adjectives',title:'I work in London',lead:'Meet Kenneth, an American delivery driver with a very strange package.',blocks:[
{t:'read',label:'Kenneth the delivery driver',p:['My name is Kenneth. I am American, but now I work in London. I am a delivery driver. My job is not always easy. Sometimes I carry normal boxes, but today I have a very strange delivery.','I have a big package in my van. It is long, heavy, and carefully wrapped. My client says it is very important. I do not know exactly what it is, but I think it is a painting. It looks like a large picture in an old frame. Maybe it is expensive. Maybe it is famous. I am not sure.','I drive across London, then I stop in front of a building. I take the package inside and give it to my client. He looks happy. I do not ask questions. That is not my job. Then I leave and go back to my van. They pay very well.']},

{p:'___ it a painting? Yes, it is.',a:'Is'},{p:'Is it a painting? Yes, ___ is.',a:'it'},{p:'Is it small? No, it ___.',a:['isn’t','isn\'t','is not']},{p:'___ it heavy? Yes, it is.',a:'Is'},{p:'Is ___ an old picture? Maybe.',a:'it'},{p:'___ it expensive? Maybe it is.',a:'Is'}]},
{t:'read',label:'Kenneth’s new delivery',p:['I have a new delivery today. It is a painting, and I have to take it to a dock in London. The job sounds simple, but the client offers me a lot of money. Much more than usual.','I have to be very careful with the painting. I need to put it in my van, drive to the dock and give it to a man there. I have to arrive before six o’clock. The client says I must not open the package or ask questions. That is strange. I deliver things every day, but people do not usually pay this much money for one painting.','I look at it again. It looks old. It is not very colorful, and I don’t understand why it is so important. But I don’t need to understand it. I just have to do my job. Still, I keep thinking: What is so special about this painting?']},
{t:'quiz',title:'True or false?',q:[
{tf:'Kenneth has a new delivery.',a:1},{tf:'He has to take the painting to a museum.',a:0,w:'He has to take it to a dock.'},{tf:'The client offers him a lot of money.',a:1},{tf:'Kenneth has to be very careful with the painting.',a:1},{tf:'He has to arrive before six o’clock.',a:1},{tf:'The client wants Kenneth to open the package.',a:0},{tf:'Kenneth thinks the situation is strange.',a:1}]}

{id:'b',letter:'B',short:'Yes, I can',eyebrow:'Dialogue · Obligation and ability',title:'Yes, I can',lead:'Kenneth talks to Sasha, and Natalia tells us what she can do.',blocks:[
{t:'read',label:'Sasha calls Kenneth',p:['Kenneth is at work. His phone rings. It is Sasha, his girlfriend.','Sasha: Hi, Kenneth. Are you coming to dinner?','Kenneth: Yes, but I will be a little late.','Sasha: Why? Are you working?','Kenneth: Yes. I have to make one more delivery.','Sasha: What do you have to deliver?','Kenneth: A painting. I have to take it to a dock.','Sasha: A painting? Interesting.','Kenneth: Yes. I have to arrive before six o’clock.','Sasha: Do you have to stay there?','Kenneth: No. I only need to give the painting to a man.','Sasha: Can you call me after the delivery?','Kenneth: Yes, I can.','Sasha: Good. Be careful!','Kenneth: I will. The client says I must be very careful.','Sasha: Why?','Kenneth: I don’t know. I mustn’t open the package, and I mustn’t ask questions.','Sasha: That is strange.','Kenneth: Yes, but they pay very well.','Sasha: OK. But you have to come to dinner after work!','Kenneth: Of course!','Sasha: See you later.','Kenneth: See you!']},
{t:'quiz',title:'Read the dialogue again · True or false?',q:[

{t:'grammar',title:'Have to vs must',html:'<p><strong>Have to</strong> — something is necessary because of a situation, a job or a rule: I have to work today. Kenneth has to deliver the painting. We have to arrive before six.</p><p><strong>Must</strong> — a strong rule, or the speaker thinks something is very important: You must be careful. Kenneth must protect the painting. You must listen to me.</p><p><strong>Remember:</strong> have to = necessary · must = very important / strong rule · mustn’t = prohibited</p>'},
{t:'read',label:'What I can do — Natalia',img:'../unit1/img/walk.jpg',alt:'Natalia and Lucy walking in London',p:['My name is Natalia. I am from Moscow, and I am a graphic designer. I can draw and I can paint. I also know how to use different design programs on my computer. I can make posters, book covers and simple illustrations. I can take good photos, and I can edit them too. When I travel, I usually take a notebook because I can draw the places I visit.','I can speak Russian and English, and I can understand a little Spanish. I can read in English, but sometimes I need a dictionary. I also know how to cook some Russian dishes. I can make pancakes and simple soups, but I can’t cook everything!','I can drive, but in London I usually prefer public transport. I can take the Underground or a bus and travel around the city. There are also things I can’t do. I can’t play the guitar, and I can’t sing very well. But I like learning new things. I think there is always something new we can learn.']},

{id:'c',letter:'C',short:'What are you doing?',eyebrow:'Dialogue · Present Continuous',title:'What are you doing?',lead:'Luis watches the docks and calls Mark.',blocks:[
{t:'read',label:'Luis calls Mark',p:['Luis is near the dock. He is watching the area carefully. Then he calls Mark.','Mark: Hello?','Luis: Mark, it’s Luis. I’m at the dock.','Mark: At the dock? What are you doing there?','Luis: I’m watching a delivery. Something strange is happening.','Mark: What do you see?','Luis: A delivery driver is arriving with a painting.','Mark: A painting?','Luis: Yes. Two men are waiting for him near a warehouse.','Mark: What are they doing?','Luis: One man is checking some documents. The other man is looking at the painting.','Mark: Are they taking it to a ship?','Luis: No. That’s the strange part. They are taking it into the warehouse.','Mark: Are you sure?','Luis: Yes. The driver is leaving now, but the two men are carrying the painting inside.','Mark: This could be connected to our case.','Luis: I think so too.','Mark: We need to work together.','Luis: I agree. We are looking for the same painting, so we can help each other.','Mark: Good. Stay there. I’m coming.','Luis: Hurry. Something is happening inside the warehouse.','Mark: I’m on my way.','Luis: See you soon.','Mark: See you.']},

{t:'grammar',title:'The -ing form',html:'<p>Usually, add <strong>-ing</strong>: work → working · read → reading · play → playing</p><p>If the verb ends in <strong>-e</strong>, remove the e: make → making · write → writing · take → taking</p><p>Sometimes, <strong>double</strong> the last consonant: run → running · sit → sitting</p>'},
{t:'quiz',title:'Write the -ing form',q:[
{p:'draw',a:'drawing'},{p:'write',a:'writing'},{p:'run',a:'running'},{p:'take',a:'taking'},{p:'sit',a:'sitting'},{p:'carry',a:'carrying'}]}
]},
{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · Summary',title:'Grammar',blocks:[
{t:'grammar',title:'1. Describing things',html:'<p><strong>be + adjective:</strong> It is big. The package is heavy. The painting is old.</p><p><strong>adjective + noun:</strong> a big package · an old painting · a strange object</p><p><strong>very</strong> makes the adjective stronger: It is very heavy.</p>'},
{t:'grammar',title:'2. This, that and it',html:'<p><strong>this</strong> — near you: This package is heavy. · <strong>that</strong> — farther away: That box is strange. · <strong>it</strong> — we already know what we are talking about: It is very old.</p><p>What is this? What is that? Is it a painting? — Yes, it is. / No, it isn’t.</p>'},
{t:'grammar',title:'3. Have to · 4. Must / mustn’t · 5. Need to',html:'<div class="cols three"><div><strong>have to / has to</strong><br>I have to work.<br>Kenneth has to deliver the painting.<br>Do you have to work?<br>He doesn’t have to stay.</div><div><strong>must / mustn’t</strong><br>You must be careful.<br>You mustn’t open the package.<br>You mustn’t ask questions.</div><div><strong>need to</strong><br>I need to call Sasha.<br>Kenneth needs to find the client.<br>We need to check the address.</div></div>'},
{t:'grammar',title:'6. Can / can’t',html:'<p>Ability or possibility: Natalia can draw. Luis can speak Spanish. Natalia can’t play the guitar.</p><p>Can you drive? — Yes, I can. / No, I can’t. The verb after can does not change: She can draw. <s>She can draws.</s></p>'},
{t:'grammar',title:'7. Present Continuous · 9. Present Simple or Present Continuous?',html:'<p><strong>am / is / are + verb-ing</strong> for actions happening now: Luis is watching the dock. The workers are carrying the painting. I am not working. What are they doing? Is Kenneth leaving? — Yes, he is.</p><p><strong>Present Simple</strong> for routines: Kenneth works as a delivery driver. Lucy drinks tea every day.<br><strong>Present Continuous</strong> for now: Kenneth is delivering a painting now. Lucy is drinking tea now.</p><p>every day / usually / sometimes → Present Simple · now / at the moment → Present Continuous</p>'},

{p:'Kenneth ___ deliver the painting before six.',o:['have to','has to','must to'],a:1},{p:'You ___ open the package. It is prohibited.',o:['mustn’t','don’t have to','can'],a:0},{p:'She can ___.',o:['draws','draw','drawing'],a:1},{p:'Kenneth ___ as a delivery driver. (routine)',o:['works','is working'],a:0},{p:'Look! Luis ___ the dock now.',o:['watches','is watching'],a:1},{p:'Lucy ___ tea every day.',o:['drinks','is drinking'],a:0},{p:'___ Kenneth have to wait?',o:['Do','Does','Is'],a:1},{p:'He ___ have to stay. (negative)',o:['doesn’t','don’t','isn’t'],a:0}]}
]},
{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · The River Thames',title:'London and its docks',blocks:[
{t:'read',p:['London has a long history with the River Thames. For many centuries, ships arrived in the city with food, clothes, wood and many other products. The docks were very busy places. Workers loaded and unloaded ships, moved boxes and carried goods to warehouses. Many people worked near the river.','Today, many old dock areas are very different. Some old warehouses are now apartments, offices, restaurants and cultural spaces. But the river is still an important part of London. You can see boats, bridges, modern buildings and old industrial areas along the Thames.','Some parts of the river are very modern, but others still show London’s history. For visitors, walking near the river is a good way to discover another side of the city.']},
