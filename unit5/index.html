{id:'a',letter:'A',short:'I like reading',eyebrow:'Reading · Hobbies',title:'I like reading…',lead:'Alicia has a small shop full of unusual and mysterious things.',blocks:[
{t:'read',label:'Things I like — Alicia',p:['My name is Alicia. I have a small shop with unusual and mysterious things. I sell old books, candles, crystals, cards and other interesting objects. I really like my shop because it is quiet and different.','In my free time, I like reading. I especially like old books and mystery stories. I also like collecting unusual objects. I have old keys, postcards, coins and some very strange things. I like listening to music when I work. I usually listen to quiet music because it helps me relax.','I also like walking in old parts of the city. I sometimes visit markets and small antique shops. I love finding objects with an interesting history. I like drawing, but I am not a professional artist. Sometimes I draw the objects in my shop in a little notebook.','I don’t like watching television very much, and I don’t like noisy places. People sometimes ask me: “Do you like magic?” I usually smile and say: “I like mysteries.”']},

{id:'b',letter:'B',short:'Do you like it?',eyebrow:'Dialogue · Likes and dislikes',title:'Do you like it?',lead:'Mark visits Alicia, his girlfriend, at her shop after work.',blocks:[
{t:'read',label:'Mark visits Alicia',p:['Mark visits Alicia at her shop after work. Alicia is his girlfriend.','Alicia: Hi, Mark. You’re late again.','Mark: I know. Sorry. I have a lot of work.','Alicia: You work too much.','Mark: Maybe. What are you doing?','Alicia: I’m reading an old book. You know I love reading.','Mark: Yes, I know. You also like collecting strange things.','Alicia: Mysterious things, Mark. Not strange things!','Mark: All right. Do you like collecting old keys?','Alicia: Yes, I do. I also like collecting old cards and coins.','Mark: What else do you like doing?','Alicia: I like listening to music, drawing and walking around old parts of the city.','Mark: Do you like watching TV?','Alicia: Not very much. I prefer reading. What about you?','Mark: I like reading too. And I love investigating mysteries.','Alicia: I know that very well.','Mark: I also like walking at night. It helps me think.','Alicia: Do you like cooking?','Mark: No, I don’t. I hate cooking.','Alicia: Good. Because I don’t like eating your food!','Mark: Very funny.','Alicia: And what do you like doing with me?','Mark: That’s easy. I like having coffee with you, walking with you and talking to you.','Alicia: Better answer.','Mark: Do I get a coffee now?','Alicia: Yes. You do.']},

{id:'c',letter:'C',short:'Let’s do something',eyebrow:'Dialogue · Invitations',title:'Let’s do something',lead:'Lucy and Natalia make plans for the afternoon.',blocks:[
{t:'read',label:'Plans',p:['Lucy and Natalia are having coffee. They are talking about their plans for the afternoon.','Lucy: Natalia, are you free this afternoon?','Natalia: Yes, I am. Why?','Lucy: Would you like to go to an art exhibition with me?','Natalia: Yes, I’d love to! I like visiting exhibitions.','Lucy: Great! And after that, do you want to have coffee somewhere?','Natalia: Sure. That sounds nice.','Lucy: There is a small café near the gallery.','Natalia: Perfect. Let’s go there.','Lucy: Good idea! How about walking along the river after coffee?','Natalia: Yes, why not? I love walking.','Lucy: And maybe we can take some photos.','Natalia: Of course. I like taking photos too.','Lucy: Excellent. So, first the exhibition, then coffee, and then a walk.','Natalia: Sounds like a perfect afternoon.','Lucy: Let’s meet at two o’clock.','Natalia: All right. See you at two!','Lucy: See you!']},

{t:'read',label:'A perfect afternoon',p:['Lucy and Natalia are free on Saturday afternoon. Lucy wants to visit a small art exhibition, so she asks Natalia: “Would you like to come with me?” Natalia smiles. “Yes, I’d love to!”','After the exhibition, they decide to have coffee. Lucy says: “How about walking along the river after that?” “Good idea,” Natalia answers. “And let’s take some photos too.” They make a simple plan and spend the afternoon together.']},

{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · Invitations · like + -ing',title:'Grammar',blocks:[
{t:'grammar',title:'Making invitations and suggestions',html:'<div class="cols"><div><strong>Would you like to + verb?</strong> (polite)<br>Would you like to go to an exhibition?<br><em>Yes, I’d love to. · Sorry, I can’t.</em><br><br><strong>Do you want to + verb?</strong><br>Do you want to have coffee?<br><em>Yes, I do. · Sure! · No, thanks.</em></div><div><strong>Let’s + verb</strong><br>Let’s go to the café. Let’s meet at two o’clock.<br><em>Good idea! · Great! · OK!</em><br><br><strong>How about + verb-ing?</strong><br>How about walking along the river?<br><em>Good idea! · Why not? · Sounds nice!</em></div></div>'},
{t:'grammar',title:'Like + -ing',html:'<p>Use <strong>like, love, enjoy, hate</strong> + verb-ing to talk about interests: I like reading. Alicia enjoys collecting antiques. Mark hates cooking.</p>'},

{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · Sport',title:'English football',blocks:[
{t:'read',p:['Football is one of the most popular sports in England. Many people watch football every weekend, and some people also play it with friends. England has many famous football clubs. Some clubs have a very long history, and families often support the same team for many years.','On match day, supporters go to the stadium, wear their team’s colours and sing songs. Other people watch the match at home or with friends. Football is an important part of free time for many English people. They like talking about matches, players and their favourite teams.','The Premier League is the most famous football league in England. Teams from different cities play against each other during the season. Football is not only about winning. For many supporters, it is also about friendship, tradition and feeling part of a community.']},
