{t:'read',label:'What did you do yesterday?',p:['Alicia: Hi, Natalia! How are you?','Natalia: Hi, Alicia! I’m fine, thanks.','Alicia: What did you do yesterday?','Natalia: Well, I got up at eight and had breakfast at home.','Alicia: What did you have for breakfast?','Natalia: I had tea, yogurt and some fruit. Then I went to the supermarket.','Alicia: Did you buy anything?','Natalia: Yes, I did. I bought some vegetables, milk and apples.','Alicia: And what did you do after that?','Natalia: I met Lucy in the afternoon. We had coffee together and visited an art gallery.','Alicia: Did you like the exhibition?','Natalia: Yes, I did. It was very interesting.','Alicia: What did you do in the evening?','Natalia: I went home, cooked dinner and watched a film.','Alicia: Did you go out after dinner?','Natalia: No, I didn’t. I was tired, so I stayed at home.','Alicia: Sounds like a good day!','Natalia: Yes, it was. What about you? What did you do yesterday?','Alicia: I worked in my shop all day.','Natalia: Anything interesting?','Alicia: Maybe. A strange man came into the shop and asked me about an old painting.','Natalia: An old painting?','Alicia: Yes. But that’s another story.']},

{id:'b',letter:'B',short:'My day yesterday',eyebrow:'Reading · Three stories',title:'My day yesterday',lead:'What did they do yesterday? Pay attention to the verbs in the Past Simple.',blocks:[
{t:'read',label:'1. Lucy — My day yesterday',p:['Yesterday was a busy but lovely day. I got up at seven o’clock and had a cup of tea. Then I opened the window and looked at the sky. It was sunny, so I decided to go out. In the morning, I worked on a new drawing. After that, I met Natalia and we went for a walk. We talked a lot and had coffee together.','In the afternoon, I visited a small art shop and bought some new pencils. Then I came home and finished my drawing. In the evening, I cooked dinner, listened to music and read a little before bed. It was a simple day, but I really enjoyed it.']},
{t:'read',label:'2. The mysterious buyer — Yesterday',p:['Yesterday I got up very early. I had breakfast at home and left the house at about seven. I took a train into the city and visited several small shops. I was looking for something. At midday, I found an interesting little shop. I went inside and saw a young woman behind the counter. I asked her about an old painting. She looked surprised.','I didn’t buy anything. I thanked her and left the shop. After that, I walked for almost an hour. Then I made a phone call. In the evening, I went home. I finally found what I was looking for. Or perhaps… I found the person who can help me find it.']},
{t:'read',label:'3. Heinrich — A very active day',p:['My name is Heinrich. I’m seventy-six years old and I’m retired, but I don’t like sitting at home all day. Yesterday I woke up at six thirty. I made breakfast and drank two cups of coffee. At eight o’clock, I went for a long walk in the park. I walked five kilometres. Then I met an old friend and we talked for half an hour.','After lunch, I worked in my garden. I cleaned the garden, watered the plants and fixed an old chair. Later, I rode my bicycle to the supermarket and bought some food. In the evening, I studied English for forty minutes. Then I called my daughter and watched a documentary. I went to bed at eleven. Retired? Yes. Inactive? Never!']},

{id:'c',letter:'C',short:'What happened?',eyebrow:'Dialogue · Irregular verbs',title:'What happened?',lead:'Alicia tells Lucy about the strange man.',blocks:[
{t:'read',label:'Something strange happened yesterday',p:['Lucy: Alicia, you look worried. What happened yesterday?','Alicia: A strange man came into the shop.','Lucy: The man you told me about?','Alicia: Yes. He came back in the afternoon.','Lucy: Really? What did he want?','Alicia: He gave me a photograph of an old painting.','Lucy: A photograph?','Alicia: Yes. Then he took an old notebook from his coat and showed me a name.','Lucy: What name?','Alicia: I don’t know. I read it, but I didn’t recognize it.','Lucy: And then?','Alicia: He said, “You already have what I need.”','Lucy: That’s strange.','Alicia: Very strange. Then he left.','Lucy: Did you follow him?','Alicia: No. But when I went outside, I saw him on the other side of the street.','Lucy: What did he do?','Alicia: He got into a black car and disappeared.','Lucy: Wow.','Alicia: And there’s something else.','Lucy: What?','Alicia: This morning I found the photograph on my desk again.','Lucy: But… how?','Alicia: I have no idea.']},

{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · Past Simple',title:'Grammar',blocks:[
{t:'grammar',title:'1. Regular verbs',html:'<p>Most verbs add <strong>-ed</strong>: work → worked · watch → watched · visit → visited</p><p>Ending in <strong>-e</strong>: add -d: live → lived · love → loved · dance → danced</p><p>Consonant + <strong>y</strong>: study → studied · carry → carried · try → tried — but play → played, enjoy → enjoyed</p><p>Some short verbs double the final consonant: stop → stopped · plan → planned</p>'},
{t:'grammar',title:'2. Irregular verbs',html:'<p>go → went · come → came · have → had · get → got · buy → bought · see → saw · take → took · give → gave · find → found · say → said · leave → left · meet → met · read → read · make → made · do → did</p>'},
{t:'grammar',title:'3–6. Affirmative, negative and questions',html:'<div class="cols three"><div><strong>Affirmative</strong><br>Subject + past form<br>Natalia bought some apples.<br>The form is the same for all subjects.</div><div><strong>Negative</strong><br>Subject + didn’t + infinitive<br>Alicia didn’t recognize the name.<br><s>didn’t went</s> → didn’t go</div><div><strong>Questions</strong><br>Did + subject + infinitive?<br>Did Alicia follow the man?<br>Yes, she did. / No, she didn’t.<br>What did you do yesterday?</div></div>'},
{t:'grammar',title:'7. Past of to be · 8. Time expressions',html:'<p>I / he / she / it → <strong>was</strong> · you / we / they → <strong>were</strong>. I wasn’t tired. They weren’t at the shop. Was Natalia at home? — Yes, she was. Do not use did with was / were: <s>Did she be tired?</s> Was she tired? ✓</p><p>yesterday · yesterday morning · last night · last week · last weekend · last year · two days ago · three weeks ago</p>'},

]},
{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · History',title:'London then and now',blocks:[
{t:'read',p:['London looked very different in the nineteenth century. People travelled around the city by horse, carriage and omnibus. The first underground railway opened in 1863, and it changed the way people moved around London.','The streets were busy and noisy. Many people worked in shops, factories, markets and docks. Street markets sold food, clothes, books and many other things. At night, gas lamps lit many streets. People didn’t have televisions, mobile phones or the Internet. They read newspapers, books and letters for information and entertainment.','Shopping was also different. People usually visited small local shops and markets. They paid with coins and carried their purchases home. London changed a lot during the nineteenth century. New railways, bridges, stations and buildings appeared, and the city became much bigger. Today, London is a modern city, but you can still see many streets, markets, stations and buildings from the past.']},
