{t:'grammar',title:'Numbers from 100 to 1,000',html:'<div class="cols three"><div>100 — one hundred<br>120 — one hundred and twenty<br>200 — two hundred<br>250 — two hundred and fifty<br>300 — three hundred</div><div>350 — three hundred and fifty<br>400 — four hundred<br>480 — four hundred and eighty<br>500 — five hundred<br>600 — six hundred</div><div>700 — seven hundred<br>800 — eight hundred<br>900 — nine hundred<br>1,000 — one thousand</div></div>'},
{t:'read',label:'Shopping',p:['Alex is in London. He goes into a small antique shop because he wants to buy some souvenirs. There are many interesting things in the shop. A key ring is 120 rubles. An old postcard is 250 rubles. A small box is 480 rubles. A beautiful compass is 900 rubles. Alex likes the compass.','Alex: How much is this compass?','Shopkeeper: It is 900 rubles.','Alex: That’s expensive. Do you have something cheaper?','Shopkeeper: Yes. This old coin is 350 rubles.','Alex: I like it. I’ll take it.','Alex also buys the postcard.','Shopkeeper: That is 600 rubles, please.','Alex: Here you are.','Shopkeeper: Thank you.','Alex pays and leaves the shop. In the street, he meets Kenneth.','Kenneth: Oh, I see you like antiques.','Alex: Yes, I like them very much.','Kenneth: I have something to offer you.','Alex: How interesting!']},

{t:'read',label:'Lucy’s daily shopping',img:'../unit1/img/lucy.jpg',alt:'Lucy with a cup of tea',p:['Lucy lives in London. She likes buying small things every day. In the morning, she usually buys a cup of tea and a croissant. The tea costs two hundred rubles and the croissant costs one hundred and fifty rubles. Later, she often buys a newspaper or a small magazine. It costs about one hundred and twenty rubles.','Sometimes she buys flowers for her home. A small bouquet costs four hundred rubles. Lucy also likes buying pencils and paper for drawing. She usually pays about three hundred rubles for them. On a normal day, Lucy spends about one thousand rubles.','She says, “I don’t buy expensive things every day. I just like small things that make my day better.”']},

{t:'read',label:'Healthy food',img:'../unit1/img/walk.jpg',alt:'Natalia in London',p:['Natalia is in London. She goes to the supermarket because she wants to buy healthy food. Natalia says: “I usually buy fruit and vegetables. I like apples, bananas, tomatoes and carrots. A kilo of apples costs 300 rubles. Bananas cost 250 rubles. Tomatoes cost 420 rubles. Carrots cost 180 rubles.','I also buy yogurt and milk. A bottle of milk costs 160 rubles, and a yogurt costs 120 rubles. Sometimes I buy fish. It is more expensive. A piece of salmon costs 850 rubles. I also like nuts. A small packet costs 500 rubles.','I try to buy healthy food because I want to eat well. Today I buy apples, tomatoes, carrots, milk and yogurt. I pay 1,180 rubles. Healthy food is not always cheap, but I think it is important.”']},

{id:'c',letter:'C',short:'I’d like…',eyebrow:'Dialogues · In a shop',title:'I’d like…',lead:'Three shopping conversations with Alex, Natalia and Lucy.',blocks:[
{t:'read',label:'Dialogue 1 — At the antique shop',p:['Alex: Good afternoon.','Shopkeeper: Good afternoon. Can I help you?','Alex: Yes, please. I’d like this old watch.','Shopkeeper: Of course.','Alex: How much is it?','Shopkeeper: It is nine hundred rubles.','Alex: Nine hundred rubles? That’s a little expensive.','Shopkeeper: It is very old and in good condition.','Alex: I see. Do you have anything cheaper?','Shopkeeper: Yes. I have some old coins and keys too.','Alex: No, thank you. I really like the watch. I’ll take it.','Shopkeeper: Very good.','Alex: Here you are.','Shopkeeper: Thank you very much.']},
{t:'read',label:'Dialogue 2 — At the supermarket',p:['Natalia: Excuse me. Do you have any Greek yogurt?','Shop assistant: Yes, we do. It is over here.','Natalia: Great. I’d like two, please.','Shop assistant: Of course. Anything else?','Natalia: Yes. I need some milk and some fruit too.','Shop assistant: We have apples, bananas and oranges.','Natalia: I’d like some apples, please.','Shop assistant: How many?','Natalia: Four apples, please.','Shop assistant: Here you are.','Natalia: Thank you. How much is everything?','Shop assistant: It is eight hundred and twenty rubles.','Natalia: Here you are.','Shop assistant: Thank you.']},
{t:'read',label:'Dialogue 3 — At the art and book shop',p:['Lucy: Hello. I’d like some postcards and a sketchbook, please.','Shop assistant: Of course. We have some postcards here.','Lucy: These are beautiful. I’d like three postcards.','Shop assistant: Sure. Would you like a small or a large sketchbook?','Lucy: A small one, please.','Shop assistant: Anything else?','Lucy: Do you have any pencils for drawing?','Shop assistant: Yes, we do.','Lucy: Great. I’d like two pencils too.','Shop assistant: No problem.','Lucy: How much is everything?','Shop assistant: It is seven hundred and fifty rubles.','Lucy: Perfect. Here you are.','Shop assistant: Thank you.','Lucy: Thank you. Goodbye.']},

{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · Quantities and prices',title:'Grammar',blocks:[
{t:'grammar',title:'Numbers and prices',html:'<p>725 — seven hundred <strong>and</strong> twenty-five · 950 — nine hundred and fifty · 21–99 use a hyphen: twenty-five, forty-eight.</p><p><strong>How much is it?</strong> It is 350 rubles. · <strong>How much are they?</strong> They are 600 rubles.</p><p><strong>I’d like</strong> = I would like: I’d like this watch, please. I’d like two yogurts, please.</p>'},
{t:'grammar',title:'Some · any · a lot of',html:'<div class="cols three"><div><strong>some</strong> — positive sentences and polite requests<br>I’d like some apples.<br>Can I have some water, please?</div><div><strong>any</strong> — questions and negatives<br>Do you have any Greek yogurt?<br>There isn’t any milk.</div><div><strong>a lot of</strong> — a large quantity<br>There are a lot of books.<br>Natalia buys a lot of vegetables.</div></div>'},
{t:'grammar',title:'How many? · How much?',html:'<p><strong>How many…?</strong> — things we can count: How many apples do you want? Four, please.</p><p><strong>How much…?</strong> — things we don’t count individually, and prices: How much milk do you need? How much is this book? It is 470 rubles.</p><p><strong>Shopping phrases:</strong> Can I help you? · Do you have any…? Yes, we do. / No, we don’t. · I’d like…, please. · Anything else? · How much is it? · I’ll take it. · Here you are.</p>'},

]},
{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · Economy and history',title:'Why is England so rich?',blocks:[
{t:'read',p:['England is part of the United Kingdom, and it has been an important economic centre for a long time. One important reason is the Industrial Revolution. In the eighteenth and nineteenth centuries, Britain developed factories, machines, railways and new industries. Cities grew quickly, and the country produced many goods.','Trade was also very important. British ships travelled around the world, and London became a major centre for international trade and finance. The British Empire also helped Britain become richer through trade, resources and control of many territories. However, this history also included conquest and exploitation.','Today, England is no longer rich because of factories alone. Services are very important. London is a major centre for banking, business, technology, education, tourism and culture. England also has famous universities, international companies and good connections with many parts of the world.','So, England’s wealth comes from a long combination of industry, trade, finance, education and international connections.']},
