{id:'a',letter:'A',short:'A very important reason',eyebrow:'Story · Review',title:'A very important reason',lead:'Natalia visits Luciano’s hotel room. There is a large, flat package on the table.',blocks:[
{t:'read',label:'A surprise',p:['Natalia is in Luciano’s hotel room in London. There is a large, flat package on the table. He keeps looking at the door, and Natalia notices that he is nervous.','Natalia: You’re very quiet today. Is everything OK?','Luciano: Yes… I think so.','Natalia: Aren’t you happy to see me?','Luciano: Of course I am! But I’m here for a very special reason.','Natalia: A special reason? What do you mean?','Luciano: Come here. I’m going to show you something.','Natalia: What’s in that package?','Luciano: Look.','He carefully opens the package. Inside, there is an old painting. Natalia looks at it for a moment, then turns to Luciano.','Natalia: Wait… I know this painting!','Luciano: You do?','Natalia: Yes! Luis and Mark are looking for it! Where did you get it?','Luciano: Natalia, I can explain.','Natalia: You… did you steal it?','Luciano: No… I didn’t steal it.','Natalia: Then why do you have it?','Luciano: It’s a long story. That’s why I came to London. I need your help.','Natalia: My help? What are you going to do with it?','Luciano: I’m not going to sell it. I’m going to give it to the right person.','Natalia: The right person? Luis is looking for this painting too! You should talk to him.','Luciano: I know. But first, you need to listen to me.','Natalia: All right. Tell me the truth. What happened?','Luciano: It all started when I—','Suddenly, the door opens. Mark and Luis appear in the doorway.','Mark: Stop, thief!','Luis: We caught you!']},

{id:'b',letter:'B',short:'The most precious thing',eyebrow:'Story · Past Simple',title:'The most precious thing',lead:'Luciano explains everything… and asks Natalia a very important question.',blocks:[
{t:'read',label:'Read the story',p:['At first, nobody moved. Luciano carefully put the painting on the table and took out his phone. He showed Mark their messages and explained that he was the person who hired him. Luis helped with the search, but Luciano was the detective’s client.','Mark looked at the screen and nodded. “Actually, I never saw my client’s face before today,” he admitted. They always communicated by phone or email. Luciano also explained that the man with the hat at the docks was his employee. He worked for Luciano and looked for the painting in London. Now Mark understood why the man knew so much about it.','Then Luciano pointed to the artist’s signature: Fernando Fader. “My name is Luciano Fader,” he said. The painter was his great-great-grandfather. Someone stole the painting from his family many years ago, and he wanted to take it back to Argentina. After a long search, he found it for sale in a London antiques shop and bought it back. He showed them the receipt.','Luis smiled with relief, but Natalia did not smile. She looked at the painting, then at Luciano. Suddenly, she felt less important than the picture in its beautiful golden frame. “You came for the painting, not for me,” she said quietly.','Her boyfriend put the receipt down and moved closer to her. “Natalia, I came for the most precious person in my life. Everything else is just a coincidence.” He took a small box out of his pocket and got down on one knee. Inside the box, there was a ring. He looked into her eyes and asked, “Will you marry me?”','For a moment, Natalia could not speak. Then she smiled, with tears in her eyes. “Yes! Of course I will!” she answered. He gently put the ring on her finger and stood up. Natalia hugged him, and all her anger disappeared.','Luis looked at Mark and smiled. The detective closed his notebook and put it in his pocket. He expected to solve a mystery that evening, but he did not expect a marriage proposal!']},

{id:'c',letter:'C',short:'The story isn’t over',eyebrow:'Dialogue · First Conditional',title:'The story isn’t over',lead:'Mark and Luis fly away from London… with more questions.',blocks:[
{t:'read',label:'On the plane',p:['Mark and Luis are on a plane. London slowly disappears beneath the clouds, but Mark still has his notebook open.','Mark: A stolen painting, a secret client and a marriage proposal. What an evening!','Luis: And we still don’t know the whole story.','Mark: What do you mean? He explained everything.','Luis: Did he? Luciano hired you to find the painting, but then he found it himself.','Mark: He said he bought it in an antiques shop.','Luis: Yes. He said a lot of things.','Mark: He showed us the receipt.','Luis: A receipt is a piece of paper, Mark. We need more information.','Mark: If we call the shop, we’ll learn more.','Luis: And if the owner doesn’t remember him?','Mark: We’ll ask more questions.','Luis: What about Fernando Fader? Was he really Luciano’s great-great-grandfather?','Mark: If we check the family documents, we’ll find out.','Luis: Everything was ready: the painting, the receipt, the ring…','Mark: Do you think he planned the whole evening?','Luis: I don’t know. But it’s all very suspicious.','Mark: Natalia looked happy.','Luis: She did. And I hope he loves her.','Mark: If he isn’t honest with her, she’ll be very upset.','Luis: Then we should be careful. We don’t want to hurt her.','Mark: You’re right. We need facts, not guesses.','Luis: If he contacts you again, will you tell me?','Mark: Of course. And if I find anything strange, I’ll call you immediately.','Luis: Good. Keep your notebook. This story isn’t over.','Mark: So when will we learn the whole truth?','Luis: Maybe in the next Outsiders book.','Mark: Another book? Then I should buy a bigger notebook!','Luis: That’s a good idea.','Mark: And where are we going now?','Luis: To New York.']},

{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · First Conditional · Review',title:'Grammar',blocks:[
{t:'grammar',title:'1. First Conditional',html:'<p>Future situations that are likely or possible: <strong>If + present simple → will + base form</strong></p><p>If it rains, I’ll take an umbrella. If Mark finds another clue, he’ll call Luis.</p><p><strong>Negative:</strong> If Mark doesn’t find another clue, he won’t call Luis.<br><strong>Questions:</strong> Will Mark call Luis if he finds another clue?<br><strong>Clause order:</strong> I’ll take an umbrella if it rains. (no comma when if comes second)</p>'},
{t:'quiz',title:'Practice · First Conditional',q:[
{p:'If Mark ___ (find) a clue, he will call Luis.',a:'finds'},{p:'If they check the receipt, they ___ (learn) more.',a:'will learn'},{p:'If her boyfriend ___ (not / tell) the truth, Natalia will be upset.',a:['doesn’t tell','does not tell']},{p:'If you find a valuable painting, you ___ (call) the police.',a:'will call'},{p:'If Mark doesn’t find another clue, he ___ (not / call) Luis.',a:['won’t call','will not call']},{p:'If Natalia ___ (call) from London, Mark will answer.',a:'calls'},{p:'If Luis finds another clue, they ___ (solve) the mystery.',a:'will solve'}]},
{t:'grammar',title:'2. Talking about the future · 3. Past Simple review',html:'<div class="cols"><div><strong>going to</strong> — plans made before speaking: I’m going to take the painting to Argentina.<br><strong>will</strong> — promises, decisions, predictions: “I’ll help you,” Mark promised. One day, they’ll discover the truth. I won’t forget you.</div><div><strong>Past Simple:</strong> Mark entered the room. He didn’t steal the painting. Did he show them the receipt? — Yes, he did.<br>After did / didn’t, use the base form: Did he buy it? ✓ <s>Did he bought it?</s><br>With be: Was Natalia surprised? Yes, she was.</div></div>'},

{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · History',title:'The British Empire',blocks:[
{t:'read',p:['The British Empire grew from English overseas expansion in the 1500s and 1600s. Merchants wanted new markets, sailors searched for trade routes, and settlers established colonies. In 1600, English merchants founded the East India Company to trade with Asia. Over time, the company used military force and political power to control large parts of India. Trade and conquest became closely connected.','Attacks on Spanish ships were also part of this early history. English captains such as Francis Drake captured ships and took their valuable cargo by force. They also attacked Spanish ports in the Americas. Some captains were privateers: they had permission from their government to attack enemy ships. Queen Elizabeth I supported Drake’s expeditions, and the English Crown received part of the profits from his raids.','Over the following centuries, Britain became famous for its powerful navy, international trade and enormous empire. It controlled territories in the Americas, Asia, Africa and the Pacific. At its greatest extent, the empire covered almost a quarter of the world’s land and ruled over a similar share of its population.','This wealth had a human cost. British merchants and plantation owners made money from the trade in enslaved Africans and their forced labor. Colonial expansion also involved violence, the taking of land and the loss of local control. For many people, the empire meant living under foreign rulers who placed British interests before their needs.','The empire declined during the 1900s. World War II left Britain with serious financial problems, while independence movements became stronger. India and Pakistan became independent in 1947. The Suez Crisis of 1956 exposed Britain’s reduced power. During the following decades, many more colonies gained independence, bringing British rule to an end across much of its former empire.']},
