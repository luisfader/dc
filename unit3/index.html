{id:'a',letter:'A',short:'A new suspect',eyebrow:'Reading · Movement verbs',title:'A new suspect',lead:'Mark has a new name on his list of suspects: Luis.',blocks:[
{t:'read',label:'Mark’s case',p:['My name is Mark. Mark Russo. I am a detective. I have a very important case: the painting The Sad Morning. My client asked me to find it. He thinks the painting is somewhere in London.','For now, I have a list of suspects. First, there is Lucy. She is an artist from London. I don’t completely trust her. Then there is Natalia. I like her, but I suspect her a little too. And now there is another person: Luis. He asks a lot of questions about old paintings. He talks to people, visits galleries and spends a lot of time in old bookshops. So now Luis is on my list too. I watch him carefully.','Every morning, Luis leaves his hotel and walks through the streets. He usually goes to a café. He enters, drinks coffee and then comes out again. After that, he crosses the street and walks to another part of the city. Sometimes he turns left, and sometimes he turns right. He often stops near old buildings and looks around. Sometimes he goes into an old bookshop and comes out with a small bag. Then he walks quickly towards the river. Sometimes he runs across the street, gets on a bus and gets off a few stops later. Finally, he returns to his hotel.','Why does he move around London so much? I don’t know yet. But I am watching him.']},

{id:'b',letter:'B',short:'A secret mission',eyebrow:'Reading · Present Simple',title:'A secret mission',lead:'Luis tells us about his work as a secret agent.',blocks:[
{t:'read',label:'Luis’s secret mission',p:['My name is Luis. I am from Argentina, but my work takes me to many different places. I am a secret agent for an organization called Southern Mystic. Most people do not know what I really do. My work is secret, and I prefer it that way.','Now I am in London because I have an important mission. It is connected to an old painting, but I cannot tell you which painting. I can only say that I need to find it before someone else does.','When I investigate, I walk around the city and visit different places. I go into cafés, bookshops, galleries and old buildings. I talk to people, ask questions and listen carefully to their answers. Sometimes I follow a person through the streets. I cross roads, turn left or right and stop when the person stops. Sometimes I wait outside a building and watch who goes in and who comes out.','I also read documents, check photos and write notes on my phone. I look for small details because they can be very important. Sometimes I take a bus or get on the Underground. I get off in another part of London and continue my investigation on foot. I usually work alone, but sometimes I need information from other people. I have to be patient, careful and observant. I cannot tell you more about my mission. Not yet.']},

{id:'c',letter:'C',short:'Around the city',eyebrow:'Reading · Places in the city',title:'Around the city',lead:'Luis and Mark follow different clues… to the same door.',blocks:[
{t:'read',label:'Text 1 — Luis looks for information',p:['Luis starts his morning at his hotel. He has one objective: find information about the mysterious painting. First, he walks to a café near the hotel. He talks to an old man there, but the man knows nothing. Luis leaves the café and walks along the street to a small bookstore.','Inside the bookstore, he asks about old art books. The owner shows him a photograph of the painting. On the back of the photograph, Luis sees an address. He leaves the bookstore, crosses the street and walks through a park. Then he goes past a bank and turns right at the corner. The address takes him to an art gallery.','Luis enters and asks some questions. A woman at the gallery gives him another clue. “The painting was here,” she says. “But now it is somewhere near the river.” Luis writes the information on his phone and leaves the gallery. His next stop is the river.']},
{t:'read',label:'Text 2 — Mark follows another clue',p:['Mark starts his investigation at a small library in another part of London. He reads an old newspaper and finds the name of a man connected to the painting. The man has a shop near the train station. Mark leaves the library and walks towards the station. He goes across a square, walks past a hotel and stops at a small antique shop. The shop is opposite the station.','Mark enters and shows the owner a photograph of the painting. The owner looks nervous. “I don’t have it,” he says. “But I know something.” He tells Mark about an old warehouse near the river. It is behind an old market and next to a bridge.','Mark immediately leaves the shop. He gets on a bus, gets off near the market and walks towards the river. Something tells him he is very close.']},
{t:'read',label:'Text 3 — Face to face',p:['Luis walks along the river until he sees the old market. There is a narrow street behind the market. At the end of the street, there is an old warehouse next to the bridge. Luis stops. “This must be the place,” he thinks.','At the same moment, Mark comes around the corner. He stops too. Luis looks at Mark. Mark looks at Luis. For a few seconds, neither man says anything.','Luis: Mark?','Mark: Luis.','They both look at the warehouse. There is one door in front of them. The painting may be inside. Mark closes his notebook. Luis puts his phone in his pocket. Now they both understand. They are looking for the same thing. The time for questions is over. The moment of truth has arrived.']},

{t:'read',label:'My neighbourhood — Lucy',img:'../unit1/img/lucy.jpg',alt:'Lucy',p:['Hi! I’m Lucy, and I live in London. There is a café near my house, and there is a small park across the street. There is also a bookstore next to the café. There are two restaurants in my neighborhood, and there are some small shops too. There is a bus stop near the park, so it is easy to go to other parts of the city. I like my neighborhood because it is quiet, friendly and interesting. What is there in your neighborhood?']},

{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · There is / there are · Prepositions',title:'Grammar',blocks:[
{t:'grammar',title:'1. There is / there are',html:'<div class="cols"><div><strong>There is</strong> + one thing<br>There is a café near my house.<br>There is a bookstore next to the hotel.</div><div><strong>There are</strong> + two or more things<br>There are two restaurants in this street.<br>There are some shops near the station.</div></div><p><strong>Negative:</strong> There isn’t a hospital near my house. There aren’t any museums in this street.</p><p><strong>Questions:</strong> Is there a café near here? — Yes, there is. / No, there isn’t. Are there any shops near the station? — Yes, there are. / No, there aren’t.</p>'},
{t:'grammar',title:'2. Prepositions of place',html:'<p><strong>in</strong> The café is in the city. · <strong>next to</strong> The bookstore is next to the café. · <strong>near</strong> The park is near the hotel. · <strong>opposite</strong> The bank is opposite the station. · <strong>between</strong> The café is between the hotel and the bookstore. · <strong>behind</strong> The warehouse is behind the market. · <strong>in front of</strong> Mark is in front of the library.</p>'},
{t:'grammar',title:'3. Prepositions of movement',html:'<p><strong>to</strong> Luis goes to the café. · <strong>from</strong> Mark comes from the library. · <strong>into</strong> Luis goes into the bookstore. · <strong>out of</strong> He comes out of the gallery. · <strong>across</strong> Natalia walks across the street. · <strong>along</strong> Luis walks along the river. · <strong>through</strong> He walks through the park. · <strong>past</strong> Mark walks past the bank. · <strong>towards</strong> He walks towards the station.</p>'},
{t:'grammar',title:'4. Giving directions',html:'<p>Use the imperative: Go straight. Turn left. Turn right. Cross the street. Walk past the café. Go through the park. Stop at the corner.</p><p><strong>Ask:</strong> How do I get to the museum?<br><strong>Answer:</strong> Go straight, turn left and walk past the café. The museum is on your right.</p>'},

{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · Transport',title:'Getting around London',blocks:[
{t:'read',p:['London is a very big city, but people have many ways to move around it. The Underground, or Tube, is very important. It connects many parts of the city. People also use buses, trains, taxis and bicycles. Walking is also common, especially in the center. You can walk from a café to a bookstore, from a park to a museum, or along the river.','London has many different neighborhoods. Some are busy and modern. Others are quiet and have small streets, old houses, local shops and parks. When people ask for directions, they often use simple expressions: Go straight. Turn left. Turn right. Cross the street. It’s next to the bank. It’s opposite the station.','London is a city where old and new places exist together. You can find a modern building next to an old bookstore, a small café near a busy station, or a quiet park in the middle of the city. For visitors, walking around London is not only a way to travel. It is also a way to discover the city.']},

{t:'think',items:['How do people move around your city?','Do you prefer the bus, the metro or walking? Why?','How do you get from your home to your favourite place? Give directions.']}
]},
