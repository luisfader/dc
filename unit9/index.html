{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · Comparing · Advice',title:'Grammar',blocks:[
{t:'grammar',title:'1. Comparatives',html:'<p>A + be + comparative + <strong>than</strong> + B: London is bigger than Oxford. Mendoza is quieter than London.</p><div class="cols"><div>Short adjectives: <strong>+ -er</strong> — small → smaller, old → older, cold → colder<br>Ending in -e: <strong>+ -r</strong> — large → larger, safe → safer<br>Consonant + vowel + consonant: <strong>double</strong> — big → bigger, hot → hotter, thin → thinner<br>Consonant + y: <strong>-ier</strong> — busy → busier, easy → easier, happy → happier</div><div>Long adjectives: <strong>more</strong> + adjective — more beautiful, more expensive, more interesting, more dangerous<br>Irregular: good → better · bad → worse · far → farther / further<br>We say shorter ✓ <s>more short</s></div></div>'},
{t:'grammar',title:'2. Superlatives',html:'<p>A + be + <strong>the</strong> + superlative: Everest is the highest mountain in the world. The Sad Morning is the most important painting in the case.</p><p>small → the smallest · large → the largest · big → the biggest · busy → the busiest · beautiful → the most beautiful · good → the best · bad → the worst · far → the farthest / furthest</p>'},
{t:'grammar',title:'3. Should / shouldn’t',html:'<p>Use <strong>should + base verb</strong> to give advice: You should tell the truth. You shouldn’t follow him alone. What should I do? Should I tell Luis? — Yes, you should. / No, you shouldn’t.</p>'},
{t:'quiz',title:'Practice · Comparative or superlative?',q:[

]},
{id:'e',letter:'E',short:'Culture',eyebrow:'Culture · History',title:'The castles of Britain',blocks:[
{t:'read',p:['Britain is famous for its castles. They are some of the most impressive buildings in the world, and they tell the most interesting stories about British history.','Windsor Castle is the oldest and the largest inhabited castle in the world. It was first built around 1070, and it is much bigger than the Tower of London. It is also more beautiful than many other castles because of its gardens. If you visit Windsor, you should take a guided tour. You shouldn’t take photos inside the State Apartments, but you should take photos in the gardens — they are the most colourful in southern England.','The Tower of London is the most famous castle in England. It is smaller than Windsor, but it is more visited by tourists. It was a prison, a palace and a zoo! You should visit the Crown Jewels there — they are the most valuable jewels in the country. You shouldn’t miss the Beefeaters, the guards in red uniforms. They are the funniest guides in London.','Edinburgh Castle in Scotland is the most spectacular castle in the UK. It is higher than many other castles because it sits on an old volcano. The views from the top are better than the views from Windsor or the Tower. You should wear comfortable shoes — the walk is more difficult than you think. You shouldn’t forget your camera!','In conclusion, Britain has some of the best castles in Europe. If you love history, you should visit at least one. Which one is the most interesting for you?']},

{t:'think',items:['Which castle would you like to visit? Why?','What is the oldest building in your city?','What advice would you give a tourist in your city?']}
