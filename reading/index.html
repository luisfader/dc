{id:'a',letter:'1',short:'Football',eyebrow:'Reading · Sport and identity',title:'Football is more than a game',blocks:[
{t:'read',p:['In England, football is part of everyday life. Many people support the same club as their parents or grandparents. A football club can represent a town, a neighborhood or even a family tradition. On match day, people wear scarves, meet their friends and walk together to the stadium. Of course, they want their team to win, but football is also about belonging to a community.','The famous clubs attract millions of fans around the world, but small local teams are important too. Their stadiums may be smaller, but their supporters often know the history of the club very well. For many people, football is not simply entertainment. It is memory, identity and friendship.']},

{id:'b',letter:'2',short:'The miners’ strike',eyebrow:'Reading · History and community',title:'The miners’ strike: community and solidarity',blocks:[
{t:'read',p:['In 1984, thousands of British coal miners stopped working during a major dispute over planned mine closures and jobs. The strike lasted almost a year and became one of the most important industrial conflicts in modern British history.','Mining was more than a job in many towns. Entire communities depended on the local mine. During the strike, families and supporters organized food collections, soup kitchens and fundraising activities. Women in mining communities played an especially important role in many of these support groups.','The conflict was also deeply divisive. Not every miner joined the strike, and there were serious disagreements about its leadership and strategy. The dispute ended in 1985 without achieving the union’s main objectives and had lasting consequences for mining communities and trade-union power in Britain.','The story is therefore not only about politics. It is also about work, community, disagreement, solidarity and what happens when an industry disappears.']},

{p:'Why did many miners stop working?',o:['A dispute over planned mine closures and jobs','They wanted a holiday','The mines were full'],a:0},{p:'How long did the strike last?',o:['Almost a year','One week','Ten years'],a:0},{p:'How did families support the miners?',o:['Food collections, soup kitchens and fundraising','They closed the mines','They moved to London'],a:0},{tf:'Every miner joined the strike.',a:0},{tf:'The strike ended in 1985 without achieving the union’s main objectives.',a:1}]},
{t:'write',title:'Discuss',prompt:'Is there an industry in your country that disappeared or changed a lot? What happened to the people and towns connected to it?',ph:'In my country…'}
]},
{id:'c',letter:'3',short:'Bookshops',eyebrow:'Reading · Books and culture',title:'Getting lost in an English bookshop',blocks:[
{t:'read',p:['A rainy afternoon, an old street and a small bookshop can be an excellent combination. England has large modern bookstores, but it also has many independent and second-hand bookshops. Some are full of novels, old maps, forgotten travel books, postcards and editions that have been out of print for years.','The best part is that you do not always know what you are going to find. You may enter looking for a detective novel and leave with a book about Victorian trains. You may find a note written by a previous owner inside an old book. Sometimes the object itself has a history.','English literature is famous around the world, but reading culture is not only about Shakespeare or Dickens. It is also about ordinary readers exploring shelves and discovering something unexpected. Getting lost in a city can be inconvenient. Getting lost in a bookshop can be wonderful.']},
{t:'quiz',title:'Reading check',q:[
{p:'What can you find in a second-hand bookshop?',o:['Novels, old maps, travel books and postcards','Only new bestsellers','Food and clothes'],a:0},{p:'Why can an old book be interesting as an object?',o:['It may have a note from a previous owner or its own history','It is always expensive','It is always famous'],a:0},{tf:'You always find the book you originally wanted.',a:0},{p:'What does “getting lost in a bookshop” mean here?',o:['Exploring and discovering something unexpected','Not finding the exit','Losing your money'],a:0}]},
{t:'write',title:'Discuss',prompt:'Would you prefer a new book or a fifty-year-old second-hand copy? Why?',ph:'I would prefer… because…'}
]},
{id:'d',letter:'4',short:'Rebellious sounds',eyebrow:'Reading · Music',title:'Rebellious sounds: punk, rock and England',blocks:[
{t:'read',p:['British music is not only about beautiful melodies. Sometimes music is a way of saying: “Something is wrong, and we want to talk about it.”','In the 1970s, punk brought a raw, direct sound to British music. The Clash became one of the most important bands of the movement. Their songs frequently dealt with social and political questions, and they participated in events such as Rock Against Racism. The Sex Pistols represented another side of early punk: provocative, confrontational and deliberately shocking.','And rebellion in British rock was not limited to punk. Pink Floyd were not a punk band: they came from psychedelic and progressive rock. But their music often explored alienation, authority, social pressure and conflict. Their 1977 album Animals was partly a response to the difficult social atmosphere in Britain during the mid-1970s, while The Wall developed themes of isolation, education, authority and the barriers people build around themselves.','This is one reason British rock became so influential. A song did not need to be only entertainment. It could tell a story, criticize society, express anger or ask uncomfortable questions. Sometimes three guitar chords were enough. Sometimes you needed an entire concept album.']},
