{id:'a',letter:'A',short:'I’m so happy!',eyebrow:'Dialogues · Be going to',title:'I’m so happy!',lead:'Good news for Natalia: Luciano is coming to London.',blocks:[
{t:'read',label:'Good news for Natalia',p:['Lucy: Alicia, Natalia is very sad.','Alicia: Why?','Lucy: Mark and Luis failed their mission.','Alicia: The mission with the painting?','Lucy: Yes. The mysterious man escaped with it.','Alicia: Poor Natalia. But I think she is going to be happy soon.','Lucy: Why?','Alicia: I heard a rumor. Luciano is going to come to London.','Lucy: Really?','Alicia: Yes. He is going to arrive tomorrow.','Lucy: Does Natalia know?','Alicia: Yes, but she doesn’t know all his plans.','Lucy: Then he’s going to surprise her.','Alicia: Yes. And I heard he knows a lot about old paintings.','Lucy: Old paintings? That’s interesting.','Alicia: Very interesting.']},
{t:'read',label:'Phone call — Lucy and Natalia',p:['Lucy: Hi, Natalia! Can I ask you something?','Natalia: Of course. What is it?','Lucy: Is Luciano going to come to London?','Natalia: Yes, he is!','Lucy: Really? When is he going to arrive?','Natalia: Tomorrow afternoon.','Lucy: That’s wonderful. Are you going to meet him at the airport?','Natalia: Yes, I am. I’m very excited.','Lucy: How long is he going to stay?','Natalia: For a few days.','Lucy: And what are you going to do together?','Natalia: We’re going to have dinner, walk around London and visit some places.','Lucy: Sounds great. You must be very happy.','Natalia: I am. I can’t wait to see him.']},

{id:'b',letter:'B',short:'We won’t give up',eyebrow:'Dialogues · Will / won’t',title:'We won’t give up',lead:'Mark and Luis lost the man, but they found a key.',blocks:[
{t:'read',label:'A new clue',p:['Mark: We lost him.','Luis: Yes, but look at this.','Mark: What is it?','Luis: He dropped a key.','Mark: Interesting. There’s a number on it.','Luis: Twenty-seven.','Mark: Maybe it’s a hotel key.','Luis: I’ll check the hotels near the dock.','Mark: Good. I’ll look at the security cameras.','Luis: And Lucy recognized that man.','Mark: You’re right. We’ll talk to her later.','Luis: Do you think he will come back?','Mark: Yes. He will make another mistake.','Luis: And next time, we’ll be ready.','Mark: We won’t lose him again.']},
{t:'read',label:'Tell me the truth',p:['Mark: All right. I want the truth.','Alex: I already told you. I have nothing to do with this.','Mark: And you, Kenneth?','Kenneth: They pay me well for my deliveries. That’s all.','Mark: You transported the painting.','Kenneth: Yes, but I didn’t know what I was transporting.','Mark: That’s a lie. You knew about the painting.','Kenneth: I knew it was expensive. I didn’t know it was stolen.','Alex: I didn’t know that either.','Mark: Who paid you?','Kenneth: I don’t know his real name.','Mark: Will you tell me everything you know?','Kenneth: Yes. I will.','Mark: Good. We need to find that painting.','Kenneth: If it’s so important to you, I’ll help you get it back.','Mark: Are you serious?','Kenneth: Yes. I’ll help you.']},
{t:'quiz',title:'True or false?',q:[

{t:'quiz',title:'Next weekend · Complete with will + verb',bank:['be','buy','go','have','meet','rain','stay','visit'],q:[

]},
{id:'c',letter:'C',short:'He’s arriving tomorrow',eyebrow:'Grammar in use · Arrangements',title:'He’s arriving tomorrow',lead:'Use the Present Continuous for fixed arrangements.',blocks:[

{t:'quiz',title:'Complete Luciano’s text with the Present Continuous',bank:['arrive','meet','stay','have','visit','go','see','fly'],q:[

{t:'note',html:'<p><strong>Remember:</strong> Present Continuous → fixed arrangement: He is meeting Natalia tomorrow. · Be going to → plan or intention: He is going to visit London. · Will → decision now, promise or prediction: He will buy the flowers. He will make the trip special.</p>'},

{id:'d',letter:'D',short:'Grammar',eyebrow:'Grammar · Future forms',title:'Going to, will or Present Continuous?',blocks:[
{t:'grammar',title:'Future forms',html:'<div class="cols three"><div><strong>be going to</strong><br>plans and intentions<br>I’m going to study tonight.<br>Look at those clouds! It’s going to rain. (evidence)</div><div><strong>will</strong><br>predictions, promises and decisions made now<br>I think it will be sunny.<br>I’ll help you. I’ll call you.</div><div><strong>Present Continuous</strong><br>fixed arrangements<br>I’m meeting my teacher at 7:00.<br>We’re flying to Rome on Friday.</div></div>'},
{t:'quiz',title:'Choose the correct form',q:[
{p:'I think it ___ tomorrow.',o:['is going to rain','will rain','is raining'],a:1},{p:'We ___ the museum this weekend. We already decided.',o:['are going to visit','will visit','are visiting'],a:0},{p:'I ___ my friend at 6:00 tomorrow.',o:['am going to meet','will meet','am meeting'],a:2},{p:'The phone is ringing. I ___ it.',o:['am going to answer','will answer','am answering'],a:1},{p:'They ___ dinner at that restaurant tonight. The table is already booked.',o:['are going to have','will have','are having'],a:2},{p:'Look at those clouds! It ___.',o:['is going to rain','will rain','is raining'],a:0},{p:'Don’t worry. I ___ you.',o:['am going to help','will help','am helping'],a:1},{p:'She ___ English next year. That is her plan.',o:['is going to study','will study','is studying'],a:0},{p:'We ___ to Madrid on Friday. We already have the tickets.',o:['are going to fly','will fly','are flying'],a:2},{p:'I think people ___ more electric cars in the future.',o:['are going to use','will use','are using'],a:1},{p:'He ___ a new job next month. He has already signed the contract.',o:['is going to start','will start','is starting'],a:2},{p:'I’m thirsty. I ___ some water.',o:['am going to get','will get','am getting'],a:1}]},
{t:'quiz',title:'Match the situation',q:[
{p:'I’ll carry your bag.',o:['decision made now','fixed arrangement','plan or intention'],a:0},{p:'We’re flying to Rome on Friday.',o:['prediction','fixed arrangement','decision made now'],a:1},{p:'I’m going to learn Italian.',o:['plan or intention','prediction','fixed arrangement'],a:0},{p:'I think it will rain.',o:['prediction','fixed arrangement','plan or intention'],a:0},{p:'Look at those black clouds! It’s going to rain.',o:['prediction based on evidence','decision made now','fixed arrangement'],a:0}]},
{t:'write',title:'Write your own sentences',prompt:'A plan for next weekend · A fixed arrangement for tomorrow · A prediction · A decision you make now · A promise',ph:'1. Next weekend, I’m going to…'}
